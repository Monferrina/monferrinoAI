# Digest mensile MonferrinoSEO → email via Resend.
# Legge Supabase (posizionamento/competitor/backlog) e invia il report ai destinatari.
# Gira il 2 del mese, DOPO l'ingest del 1° (0 9 1) e il backup del 2 (0 4 2): dati freschi.
# Gira solo sul default branch (vincolo GitHub schedule).
name: Digest mensile

on:
  schedule:
    - cron: '0 8 2 * *' # il 2 del mese, 08:00 UTC (dopo ingest del 1° e backup del 2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Costruisce l’HTML e lo stampa, nessun invio'
        type: boolean
        default: false

# Least privilege: solo checkout + npm + script; accessi esterni via secrets.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run digest -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }} # opzionale; default nel codice (dominio verificato)
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REGION: ${{ secrets.SUPABASE_PROJECT_REGION }}
      # Il digest gira una volta al mese e il suo unico output osservabile è l'email:
      # senza alert, "fallito" e "non ancora arrivato" sono indistinguibili dall'esterno.
      - name: Alert email su fallimento (Resend)
        if: failure()
        run: |
          jq -n --arg to "$ALERT_TO" \
            --arg subject "[monferrinoAI] FALLITO: $WORKFLOW" \
            --arg text "Run fallito: $RUN_URL" \
            '{from: "MonferrinoSEO <agente@vetreriamonferrina.com>", to: ($to | split(",")), subject: $subject, text: $text}' \
          | curl -sf https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.DIGEST_TO }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
