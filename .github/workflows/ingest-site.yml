# Ingest settimanale del PROPRIO sito: scrape → embed → insert idempotente in site_pages.
# È la parte del RAG che risponde a "cosa esiste già sul sito", e serve a non riproporre
# contenuti che ci sono di già.
#
# Perché esiste (27/7): questo ingest non aveva NESSUNA schedulazione — girava solo a mano.
# Risultato: al 27 luglio site_pages era fermo al 1° luglio, quindi l'agente ragionava su una
# foto vecchia di quasi un mese. Il RAG funzionava bene, ma su dati scaduti.
#
# Budget: 29 pagine × 4,33 settimane ≈ 126 crediti Firecrawl/mese, il 13% del piano da 1.000.
# Insieme all'ingest competitor si sta al 26%.
#
# Gira solo sul default branch (vincolo GitHub schedule).
name: Ingest sito (knowledge base propria)

on:
  schedule:
    - cron: '30 9 * * 1' # lunedì 09:30 UTC, mezz'ora dopo l'ingest competitor
    # Sfalsato di proposito: i due job scrivono su tabelle diverse ma condividono
    # la quota Firecrawl e il pooler Supabase. Sequenziali = più facili da leggere nei log.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo scrape+validate, nessun insert (test a costo crediti minimo)'
        type: boolean
        default: false
      limit:
        description: 'Limita a N pagine (vuoto = tutte le 29)'
        type: string
        default: ''

# Least privilege: solo checkout + npm + script; gli accessi esterni passano dai secrets.
permissions:
  contents: read

jobs:
  ingest-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install -g firecrawl-cli # il job usa la CLI; si autentica via FIRECRAWL_API_KEY
      - run: npm run ingest:site -- ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REGION: ${{ secrets.SUPABASE_PROJECT_REGION }}
      # I chunk si derivano da site_pages, quindi vanno rifatti subito dopo: una pagina
      # aggiornata con i chunk della versione precedente farebbe dire al RAG che una sezione
      # c'è ancora quando non c'è più. Nessuno scrape qui, solo lettura dal DB e embedding:
      # salta da sé le pagine il cui content_hash è già stato chunkato.
      - name: Ricostruisci i chunk delle pagine cambiate
        if: ${{ !inputs.dry_run }}
        run: npm run chunk
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REGION: ${{ secrets.SUPABASE_PROJECT_REGION }}

      - name: Alert email su fallimento (Resend)
        if: failure()
        run: |
          jq -n --arg to "$ALERT_TO" \
            --arg subject "[monferrinoAI] FALLITO: $WORKFLOW" \
            --arg text "Run fallito: $RUN_URL" \
            '{from: "MonferrinoSEO <agente@vetreriamonferrina.com>", to: ($to | split(",")), subject: $subject, text: $text}' \
          | curl -sf https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.DIGEST_TO }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
