# Ingest mensile competitor: scrape → embed → insert idempotente in competitor_snapshots.
# Additivo (niente --fresh): accumula la storia degli snapshot cambiati.
# Gira solo sul default branch (vincolo GitHub schedule).
name: Ingest competitor snapshots

on:
  schedule:
    - cron: '0 9 1 * *' # 1° del mese, 09:00 UTC = 10:00 (inverno) / 11:00 (estate) Rome.
    # Sempre DOPO il monitor Firecrawl del mattino: 09:00 UTC è oltre il monitor in
    # entrambe le stagioni, così il DST non anticipa più l'ingest davanti al monitor.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo scrape+validate, nessun insert (test a costo crediti minimo)'
        type: boolean
        default: false
      fresh:
        description: 'TRUNCATE + ripopola pulito in transazione (bonifica retroattiva PII). ~30 crediti Firecrawl.'
        type: boolean
        default: false
      limit:
        description: 'Limita a N pagine (vuoto = tutte le 30)'
        type: string
        default: ''

# Least privilege: il job fa solo checkout + npm + script (gli accessi esterni
# passano via secrets). contents:read basta e silenzia l'alert CodeQL
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install -g firecrawl-cli # il job usa la CLI; si autentica via FIRECRAWL_API_KEY
      - run: npm run ingest -- ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.fresh && '--fresh' || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REGION: ${{ secrets.SUPABASE_PROJECT_REGION }}
      - name: Alert email su fallimento (Resend)
        if: failure()
        run: |
          jq -n --arg to "$ALERT_TO" \
            --arg subject "[monferrinoAI] FALLITO: $WORKFLOW" \
            --arg text "Run fallito: $RUN_URL" \
            '{from: "MonferrinoSEO <agente@vetreriamonferrina.com>", to: ($to | split(",")), subject: $subject, text: $text}' \
          | curl -sf https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.DIGEST_TO }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
